name: memory-os

x-core-env: &core-env
  API_KEY: ${API_KEY:?Set API_KEY in .env}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
  API_KEYS_JSON: ${API_KEYS_JSON:-{}}
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,api:*}
  DATABASE_URL: ${DATABASE_URL:-postgresql://memory:${POSTGRES_PASSWORD:-change-me}@postgres:5432/memory}
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-memory_os}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_UI_URL: ${LANGFUSE_UI_URL:-http://localhost:3000}
  LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-memory-os}
  LANGFUSE_USER_ID: ${LANGFUSE_USER_ID:-default}
  LANGFUSE_SCOPE: ${LANGFUSE_SCOPE:-default}

# Adapted from Langfuse v3.132.0 official docker-compose.yml.
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-change-me}@langfuse-postgres:5432/langfuse
  NEXTAUTH_URL: ${LANGFUSE_UI_URL:-http://localhost:3000}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-replace-me}
  SALT: ${LANGFUSE_SALT:-replace-me}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${REDIS_PASSWORD:-change-me}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${MINIO_PUBLIC_URL:-http://localhost:9090}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

services:
  postgres:
    image: postgres:16.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: memory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  api:
    build: .
    image: memory-os:local
    restart: unless-stopped
    environment: *core-env
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1g

  worker:
    build: .
    image: memory-os:local
    command: ["python", "-m", "memory_os.worker"]
    restart: unless-stopped
    environment: *core-env
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1536m

  langfuse-postgres:
    profiles: [langfuse]
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  clickhouse:
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:25.3.6.56-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2g

  redis:
    profiles: [langfuse]
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 192mb --maxmemory-policy noeviction --appendonly yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  minio:
    profiles: [langfuse]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ['mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "${LANGFUSE_BIND:-127.0.0.1}:${MINIO_PORT:-9090}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9091}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  langfuse-web:
    profiles: [langfuse]
    image: langfuse/langfuse:3.132.0
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: memory-os
      LANGFUSE_INIT_ORG_NAME: Memory OS
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-memory-os}
      LANGFUSE_INIT_PROJECT_NAME: Memory OS
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "${LANGFUSE_BIND:-127.0.0.1}:${LANGFUSE_PORT:-3000}:3000"
    depends_on: &langfuse-dependencies
      langfuse-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1536m

  langfuse-worker:
    profiles: [langfuse]
    image: langfuse/langfuse-worker:3.132.0
    restart: unless-stopped
    environment: *langfuse-env
    depends_on: *langfuse-dependencies
    mem_limit: 1536m

volumes:
  postgres-data:
  qdrant-data:
  langfuse-postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  minio-data:
