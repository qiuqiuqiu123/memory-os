server {
    listen 80;
    server_name vectorplanets.com;
    root /www/wwwroot/ego-demo;
    index index.html;
    access_log /www/wwwlogs/vectorplanets.com.access.log;
    error_log /www/wwwlogs/vectorplanets.com.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/memory-os/shared/acme;
        try_files $uri =404;
    }
    location = /memoryos { return 308 /memoryos/; }
    location ^~ /memoryos/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        client_max_body_size 10m;
    }
    location / { try_files $uri $uri/ =404; }
}
